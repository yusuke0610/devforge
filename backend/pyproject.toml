# 依存の SSoT は本ファイルの [project.dependencies] + uv.lock（ADR-0021 Phase 0）。
# 追加・更新後は `cd backend && uv lock` で uv.lock を再生成してコミットすること。
# 供給網リスク（レンジ内 yank / 侵害バージョンの混入）を避けるため全依存を == で固定する（P7）。
# CVE は CI の pip-audit が検出するので、検出時に明示バージョンを引き上げる運用とする。
[project]
name = "devforge-backend"
version = "0.0.0"
description = "DevForge backend (FastAPI)"
# libsql-experimental（sqlalchemy-libsql 経由）が Python 3.14 未対応のため 3.13 系に固定する
# （renovate.json5 の allowedVersions "<3.14" と同期）
requires-python = "==3.13.14"
dependencies = [
    "fastapi==0.139.2",
    # starlette は fastapi の推移的依存だが、PYSEC-2026-161（Host ヘッダ未検証による認証バイパス）
    # 対策で明示固定する。さらに CVE-2026-54282 / CVE-2026-54283 対策で 1.3.1 へ更新
    "starlette==1.3.1",
    "uvicorn[standard]==0.51.0",
    "sqlalchemy==2.0.51",
    "sqlalchemy-libsql==0.2.0",
    "alembic==1.18.5",
    "pydantic[email]==2.13.4",
    "python-dotenv==1.2.2",
    "reportlab==5.0.0",
    "google-cloud-storage==3.13.0",
    "pytest==9.1.1",
    "PyJWT[crypto]==2.13.0",
    "httpx==0.28.1",
    # マルチプロバイダ LLM（ADR-0013）。Gemini = google-genai、GPT = openai。
    # Gemini / Anthropic は Vertex AI（SA→ADC）経由（ADR-0015）。anthropic[vertex] の
    # extra が ADC 用の google-auth を引き込む。google-genai は vertexai=True で Vertex 対応。
    "anthropic[vertex]==0.116.0",
    "google-genai==2.11.0",
    "openai==2.45.0",
    # Stripe Checkout / Webhook 署名検証（ADR-0012 Phase 2）。公式ライブラリを使う
    "stripe==15.3.1",
    "PyGithub==2.9.1",
    "slowapi==0.1.10",
    "ruff==0.15.22",
    "autopep8==2.3.2",
    "markdown==3.10.2",
    "weasyprint==69.0",
    "pydyf==0.12.1",
    "redis==8.0.1",
    "isort==8.0.1",
    "black==26.5.1",
    "pytest-cov==7.1.0",
    "google-cloud-tasks==2.23.0",
    "pyasn1==0.6.4",
    # CVE-2026-53538 / CVE-2026-53539 / CVE-2026-53540 対策で 0.0.31 以上へ更新済み
    "python-multipart==0.0.32",
    # ミューテーションテスト（週次 CI: .github/workflows/mutation.yml / ADR-0017）
    "mutmut==3.6.0",
]

[tool.uv]
# backend はアプリケーション（app/ レイアウト）でありパッケージとして build/install しない。
# 依存はローカル・CI とも flake.nix の uv2nix build（devshell）が提供し、uv sync は使わない
# （ADR-0021 Phase 1/2）。uv は uv.lock の更新（uv lock）と uvx / uv tool run 専用。
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
# --cov は Makefile / CI 側の pytest 呼び出しで付与する。addopts に置くと mutmut が
# mutants/ 内で pytest を内部実行する際にも全ミュータントへ coverage 計測が載り干渉するため（ADR-0017）
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

# ミューテーションテスト（週次 CI: .github/workflows/mutation.yml / ADR-0017）
# 対象は高価値な決定論的ビジネスロジックに限定する。source_paths の app 全体は
# mutants/ へコピーされる（import・JSON リソース解決のため）が、変異を加えるのは
# only_mutate のグロブ（fnmatch。"*" は "/" にもマッチ）に一致するファイルのみ。
# schemas / models / routers / alembic_migrations / prompts / LLM クライアント等の
# I/O 層・宣言層は対象外（テストで殺せないミュータントがノイズになるため）
[tool.mutmut]
source_paths = ["app"]
only_mutate = [
    "app/services/blog/scorer.py",                        # ブログ技術記事スコアリング
    "app/services/billing/pricing.py",                    # 課金レート表
    "app/services/billing/credit_service.py",             # クレジット計算・残高
    "app/services/intelligence/skills/*",                 # スキル推論（aggregator/linguist/パーサ群）
    "app/services/intelligence/github/repo_analyzer.py",  # リポジトリ解析
    "app/services/intelligence/github/contributions.py",  # コントリビューション集計
    "app/services/shared/*",                              # sort_utils / resume_format
    "app/services/tasks/worker.py",                       # タスク状態遷移
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests", "alembic_migrations"]

[tool.black]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

# import 解決先の Python は実行側が --pythonpath で明示する（ADR-0021 Phase 1/2）:
#   ローカル・CI とも make typecheck-backend が devshell の python3（uv2nix build）を渡す
[tool.pyright]
pythonVersion = "3.13"
include = ["app", "tests", "alembic_migrations"]
extraPaths = ["."]
