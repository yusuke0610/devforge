services:
  api:
    # build context はリポジトリルート（Dockerfile が flake.nix を参照するため / ADR-0021 Phase 3）
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: devforge-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      libsql:
        condition: service_started
    environment:
      # compose の libsql サービス（docker network 内）に接続する。
      # compose 起動時はここで上書きする。Turso Cloud を使う場合は .env で URL を設定すること
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      UPSTASH_REDIS_URL: ${UPSTASH_REDIS_URL}
      UPSTASH_REDIS_TOKEN: ${UPSTASH_REDIS_TOKEN}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      TASK_RUNNER: ${TASK_RUNNER}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      CLOUD_TASKS_QUEUE: ${CLOUD_TASKS_QUEUE}
      CLOUD_TASKS_LOCATION: ${CLOUD_TASKS_LOCATION}
      CLOUD_TASKS_SERVICE_URL: ${CLOUD_TASKS_SERVICE_URL}
      CLOUD_TASKS_SERVICE_ACCOUNT: ${CLOUD_TASKS_SERVICE_ACCOUNT}
      ENVIRONMENT: ${ENVIRONMENT}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      CALLBACK_BASE_URL: ${CALLBACK_BASE_URL}
      TASK_MAX_ATTEMPTS: ${TASK_MAX_ATTEMPTS}
      # DevForge Agent（ADR-0010）。ローカルは Ollama を既定とする
      # ローカルは Ollama 上書きで無料動作（ADR-0013）。Gemini/Anthropic は本番では
      # Vertex AI（SA→ADC）経由（ADR-0015）でキー不要。ローカルで実 Vertex を叩く場合のみ
      # gcloud auth application-default login で ADC を用意する（GCP_PROJECT_ID は上で設定済み）。
      LLM_LOCAL_OLLAMA: ${LLM_LOCAL_OLLAMA:-1}
      # 既定値を付ける（:-）。bare の ${VAR} は未設定時に空文字を注入し、backend 側
      # settings.py の os.getenv フォールバックを潰してしまう（Vertex client が空ロケーションで初期化される）
      VERTEX_ANTHROPIC_LOCATION: ${VERTEX_ANTHROPIC_LOCATION:-asia-southeast1}
      # Ollama は compose に含めず**ホスト側**（`ollama serve` / Ollama.app）で動かす（ADR-0010）。
      # macOS の Docker は GPU（Metal）を使えず、コンテナ内推論が大幅に遅くなるため。
      # コンテナからは extra_hosts の host.docker.internal 経由でホストの 11434 に出る。
      # settings.py の既定は localhost（コンテナ外で uvicorn を直接動かす場合の値）なので、
      # compose 側で host.docker.internal を既定として上書きする
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      # Agent の日次利用上限（#521 / ADR-0023）。未設定なら backend 既定値（50）
      AGENT_DAILY_LIMIT: ${AGENT_DAILY_LIMIT}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      APP_VERSION: ${APP_VERSION}
    ports:
      - "8000:8000"
    # Linux で host.docker.internal を解決するための設定（macOS / Windows では不要だが指定しても無害）
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    container_name: devforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # libSQL (Turso) サーバー。ローカル開発で sqld を別途インストールせずに利用するため。
  # 永続化は libsql_data ボリュームに保存。本番は Turso Cloud を直接参照する想定
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:latest@sha256:bc100873a74865392a49191b4733025fe8222a409799efa424dc196feaf05035
    container_name: devforge-libsql
    restart: unless-stopped
    environment:
      SQLD_NODE: primary
    ports:
      # TablePlus 等のクライアントからホスト経由で接続できるよう公開
      - "8080:8080"
    volumes:
      - libsql_data:/var/lib/sqld

volumes:
  libsql_data:
