# IT 用語の表記ゆれ辞書（prh）。
# 職務経歴書で頻出する固有名詞・技術用語の正規化に絞る。
# `expected` が正、`patterns` が誤記（自動マッチ）。誤検出を避けるため過剰なパターンは登録しない。
version: 1
rules:
  # 言語・ランタイム
  - expected: JavaScript
    patterns:
      - javascript
      - Javascript
      - java script
  - expected: TypeScript
    patterns:
      - typescript
      - Typescript
      - type script
  - expected: Node.js
    patterns:
      - node.js
      - Nodejs
      - NodeJS
      - node js
  - expected: Python
    patterns:
      - python
  - expected: Ruby
    patterns:
      - ruby
  - expected: PHP
    patterns:
      - Php
  - expected: Golang
    patterns:
      - golang
  # フレームワーク・ライブラリ
  - expected: React
    patterns:
      - react
  - expected: Vue.js
    patterns:
      - vue.js
      - Vuejs
  - expected: Next.js
    patterns:
      - next.js
      - Nextjs
  - expected: Django
    patterns:
      - django
  - expected: FastAPI
    patterns:
      - fastapi
      - Fastapi
  # インフラ・ツール
  - expected: Docker
    patterns:
      - docker
  - expected: Kubernetes
    patterns:
      - kubernetes
  - expected: GitHub
    patterns:
      - github
      - Github
      - git hub
  - expected: GitLab
    patterns:
      - gitlab
      - Gitlab
  - expected: MySQL
    patterns:
      - mysql
      - Mysql
  - expected: PostgreSQL
    patterns:
      - postgresql
      - Postgresql
      - postgres
  - expected: Redis
    patterns:
      - redis
  # 一般的な表記ゆれ
  - expected: ソフトウェア
    patterns:
      - ソフトウエア
  - expected: ハードウェア
    patterns:
      - ハードウエア
  - expected: インターフェース
    patterns:
      - インタフェース
      - インターフェイス
  - expected: データベース
    patterns:
      - データーベース
  - expected: ディレクトリ
    patterns:
      - ディレクトリー
