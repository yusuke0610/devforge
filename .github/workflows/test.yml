name: Test

# テスト/品質ゲートの再利用可能ワークフロー（ci.yml から workflow_call で呼ばれる）。
# detect-changes の結果を inputs で受け取り、各ジョブの実行可否を制御する。
# ただし lint-ssot（SSoT drift 検知）は docs / .claude の変更も検知対象に含むため、
# inputs でゲートせず常に実行する。
# deploy のゲート判定は deploy-gate ジョブが集約し、deploy_gate 出力として公開する。
on:
  workflow_call:
    inputs:
      app:
        description: "アプリ関連ファイル（web/backend 等）に変更があるか"
        type: boolean
        required: true
      dupe:
        description: "重複検知の対象ファイルに変更があるか"
        type: boolean
        required: true
    outputs:
      deploy_gate:
        description: "deploy 可否のゲート（pass / fail）。test-web / test-backend / codegen-drift / lint-ssot の結果のみで判定する"
        value: ${{ jobs.deploy-gate.outputs.status }}

permissions:
  contents: read

jobs:
  # 領域跨ぎの SSoT drift 検知。bash/grep/comm/git のみに依存し nix も npm も要らないため、
  # 数秒で終わる独立ジョブとして「常に」実行する（inputs.app でゲートしない）。
  #
  # 以前は test-backend の先頭ステップに同居していたが、そのジョブが `if: inputs.app` で
  # ゲートされているため docs だけを変更した PR では丸ごと skip され、ADR 索引の drift を
  # 検知できなかった（ADR-0026 の PR で発覚）。検知対象（docs/adr/**・.claude/**）と
  # 実行条件（web/**・backend/**）がズレていたのが原因なので、ゲートから外して切り出す。
  lint-ssot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # lint-tdd が base ブランチとの merge-base diff を必要とするため全履歴を取得する。
          fetch-depth: 0
          # 読み取り専用ジョブのため checkout の認証情報をディスクに残さない（サプライチェーン保護）。
          persist-credentials: false

      # env_keys.py↔docker-compose / errors.py↔errorCodes.ts の SSoT drift 検知。
      # grep/sed/comm のみに依存する（ripgrep は使わない）。
      - name: Lint SSoT (env names / error codes)
        run: bash scripts/lint-env-keys.sh

      # ADR 索引（docs/adr/README.md）↔ ADR ファイルの drift 検知。
      # 一覧の複製（旧 CONTRIBUTING の表）が陳腐化した再発防止。bash/grep/comm のみ。
      - name: Lint SSoT (ADR index)
        run: bash scripts/lint-adr-index.sh

      # TDD 対象（決定論的ロジック層 = mutmut/stryker スコープ）の実装変更に
      # テスト差分が随伴しているかを検知（ADR-0019）。bash/git/awk/sed のみ。
      - name: Lint SSoT (TDD test accompaniment)
        run: bash scripts/lint-tdd.sh

  detect-duplication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ inputs.dupe }}
    # Phase 3 初期は warn-only。baseline 取得後に continue-on-error: false へ切替予定。
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # 読み取り専用ジョブのため checkout の認証情報をディスクに残さない（サプライチェーン保護）。
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run jscpd
        run: npx --yes jscpd@4 --config .jscpd.json

      - name: Upload duplication report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: jscpd-report
          path: report/dupe/
          retention-days: 14

  test-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ inputs.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 読み取り専用ジョブのため checkout の認証情報をディスクに残さない（サプライチェーン保護）。
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: バージョン確認
        run: |
          echo "Node.js: $(node --version)"
          echo "npm    : $(npm --version)"

      - name: Install dependencies
        run: npm ci --prefix web

      - name: 脆弱性スキャン (npm audit)
        run: node web/scripts/audit-check.mjs

      - name: Lint web
        run: npm run lint --prefix web

      - name: Run web tests
        run: npm run test --prefix web

      - name: Build web
        run: npm run build --prefix web

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ inputs.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 読み取り専用ジョブのため checkout の認証情報をディスクに残さない（サプライチェーン保護）。
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: バージョン確認
        run: |
          echo "Node.js  : $(node --version)"
          echo "npm      : $(npm --version)"

      - name: Install dependencies
        run: npm ci --prefix web

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: web

      - name: Run E2E tests
        run: npm run test:e2e --prefix web
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  test-backend:
    runs-on: ubuntu-latest
    # Nix store キャッシュミス時は devshell（uv2nix build）の構築に数分かかるため余裕を持たせる
    timeout-minutes: 20
    if: ${{ inputs.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 読み取り専用ジョブのため checkout の認証情報をディスクに残さない（サプライチェーン保護）。
          persist-credentials: false

      # dev と CI のビルド経路を Nix devshell（uv2nix build）へ一致させる（ADR-0021 Phase 2）。
      # WeasyPrint のネイティブライブラリ・Python 3.13・依存パッケージはすべて devshell が提供する。
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # flake inputs（nixpkgs / uv2nix 等）の GitHub 取得でレート制限に当たらないようにする
          github_access_token: ${{ github.token }}

      # devshell の closure（uv2nix build の Python 環境込み）を GitHub Actions cache に保存する。
      # キーは flake と uv.lock のハッシュ。ミス時は restore-prefixes-first-match で旧キャッシュから
      # 差分ビルドする。古い世代は GitHub の容量上限（10GB）到達時に LRU で自動退避される。
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'backend/pyproject.toml', 'backend/uv.lock') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-

      - name: Build devshell (uv2nix)
        run: nix develop --command true

      # uv.lock が pyproject.toml と drift していたら fail する（旧 uv sync --locked 相当 / ADR-0021 Phase 0）。
      # uv2nix は uv.lock を正として build するため、drift の検知はこのステップが担う。
      - name: uv.lock の drift 検証
        run: nix develop --command bash -c "cd backend && uv lock --check"

      - name: バージョン確認
        run: nix develop --command bash -c "python3 --version && uv --version && ruff --version"

      # uv.lock の全依存（推移的依存込み）を requirements 形式へ export して監査する。
      # --no-deps --disable-pip: export 結果は完全固定の全依存なので依存解決・install は不要。
      # （一時 venv を作らないため、ensurepip を持たない Nix の python でも動く）
      - name: 脆弱性スキャン (pip-audit)
        run: |
          nix develop --command bash -c "cd backend && uv export --frozen --no-emit-project --no-hashes \
            --format requirements-txt --output-file /tmp/requirements-audit.txt \
            && uv tool run --python 3.13 pip-audit --no-deps --disable-pip -r /tmp/requirements-audit.txt"

      # lint / typecheck / test はローカルと同一の make ターゲットを呼ぶ（コマンドの SSoT は Makefile）。
      # pyright の import 解決も devshell の python に一致する（.venv 参照は ADR-0021 Phase 1 で撤廃）。
      - name: Lint backend
        run: make lint-backend

      - name: Type check backend (pyright)
        run: make typecheck-backend

      # --cov は pyproject の addopts ではなく make test-backend 側で付与される（mutmut 干渉回避 / ADR-0017）
      - name: Run backend tests
        run: make test-backend

  # OpenAPI → TypeScript 型のドリフト検知 (ADR-0007)。
  # backend schema を変更したのに web/src/api/generated.ts を再生成して
  # いない状態をビルドで落とす。エラーコードの型縛りと同じ思想。
  codegen-drift:
    runs-on: ubuntu-latest
    # Nix store キャッシュミス時は devshell（uv2nix build）の構築に数分かかるため余裕を持たせる
    timeout-minutes: 20
    if: ${{ inputs.app }}

    steps:
      - name: Checkout
        # サプライチェーン保護のためコミット SHA で pin する（ADR-0007 codegen-drift を先行対応）。
        # 型生成のドリフト検知のみで push はしないため認証情報は保持しない。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # dev と CI のビルド経路を Nix devshell へ一致させる（ADR-0021 Phase 2）。
      # Python（WeasyPrint ネイティブ依存込み）と Node.js の両方を devshell が提供するため、
      # 型の再生成はローカルと同一の make codegen-types を呼ぶ（コマンドの SSoT は Makefile）。
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # flake inputs（nixpkgs / uv2nix 等）の GitHub 取得でレート制限に当たらないようにする
          github_access_token: ${{ github.token }}

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'backend/pyproject.toml', 'backend/uv.lock') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-

      - name: Build devshell (uv2nix)
        run: nix develop --command true

      - name: Install web dependencies
        run: make install-web

      - name: OpenAPI → TypeScript 型を再生成
        run: make codegen-types

      - name: Check generated types drift
        run: |
          if ! git diff --exit-code web/src/api/generated.ts; then
            echo "::error::web/src/api/generated.ts が最新ではありません。'make codegen-types' を実行して再生成し、コミットしてください (ADR-0007)。"
            exit 1
          fi

  # コンテナ起動スモークテスト。
  # test-backend は devshell + 標準 SQLite で動くため、本番イメージ（Dockerfile 内の
  # nix build / ADR-0021 Phase 3）の実イメージ組み立て・libsql ネイティブドライバ・
  # alembic マイグレーション実行・uvicorn 起動という実行パスを一度も通らない。
  # 実際にイメージを build → libsql を立てて起動し、/health（DB 接続を検証する）が
  # 200 を返すことを確認することで、「ビルドは通るが起動時にネイティブ拡張が
  # segfault する」種の不具合を CI で検知する。
  # （例: Python 3.14 への bump で libsql-experimental が segfault した事象）
  smoke-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ inputs.app }}

    steps:
      - name: Checkout
        # スモークテストは repo への push をしないため認証情報を保持しない（サプライチェーン保護）。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 起動用の一時シークレットを生成 (.env)
        run: |
          # 起動検証専用の使い捨て鍵。永続化せず CI 実行限りで破棄する。
          PRIV="$(openssl genrsa 2048 2>/dev/null)"
          PUB="$(printf '%s' "$PRIV" | openssl rsa -pubout 2>/dev/null)"
          # docker-compose の .env は複数行値を扱えないため、PEM を \n エスケープした
          # 1 行値にする（settings.get_jwt_private_key が \n をアンエスケープする）。
          PRIV_ESC="$(printf '%s' "$PRIV" | awk 'BEGIN{ORS="\\n"}{print}')"
          PUB_ESC="$(printf '%s' "$PUB" | awk 'BEGIN{ORS="\\n"}{print}')"
          # Fernet 鍵 = 32 バイトの urlsafe base64
          FERNET="$(openssl rand -base64 32 | tr '+/' '-_')"
          cat > .env <<EOF
          TURSO_DATABASE_URL=http://libsql:8080
          TURSO_AUTH_TOKEN=
          FIELD_ENCRYPTION_KEY=${FERNET}
          JWT_PRIVATE_KEY=${PRIV_ESC}
          JWT_PUBLIC_KEY=${PUB_ESC}
          CORS_ORIGINS=http://localhost:5173
          ENVIRONMENT=local
          LLM_LOCAL_OLLAMA=1
          EOF

      - name: イメージを build してスタックを起動
        run: docker compose up -d --build api

      - name: /health が 200 を返すまで待機（起動成功を検証）
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then
              echo
              echo "✅ backend 起動成功"
              exit 0
            fi
            state="$(docker inspect -f '{{.State.Status}}' devforge-api 2>/dev/null || echo missing)"
            if [ "$state" != "running" ]; then
              echo "::error::api コンテナが起動状態ではありません (state=$state)。Segfault / マイグレーション失敗などの可能性。"
              break
            fi
            sleep 2
          done
          echo "----- api logs -----"
          docker compose logs api
          exit 1

      - name: 後片付け
        if: always()
        run: docker compose down -v

  # deploy のゲート判定を集約する。
  # 現行 ci.yml の deploy 条件（test-web / test-backend / codegen-drift が
  # success または skipped）を忠実に再現する。test-e2e / smoke-backend は
  # 意図的にゲートへ含めない（e2e はフレーキーなため deploy をブロックさせない）。
  deploy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test-web, test-backend, codegen-drift, lint-ssot]
    if: always()
    outputs:
      status: ${{ steps.compute.outputs.status }}

    steps:
      - name: ゲート判定
        id: compute
        run: |
          # success または skipped を pass とする（現行 deploy の if 条件と同義）
          # lint-ssot は test-backend から切り出した SSoT drift 検知。同居していた頃は
          # その失敗が test-backend の失敗としてゲートに効いていたため、ここに含めて
          # ゲートの強さを維持する（切り出しでデプロイ条件を緩めない）。
          for r in "${{ needs.test-web.result }}" \
                   "${{ needs.test-backend.result }}" \
                   "${{ needs.codegen-drift.result }}" \
                   "${{ needs.lint-ssot.result }}"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "status=fail" >> "$GITHUB_OUTPUT"
              echo "deploy gate: fail (test-web=${{ needs.test-web.result }} / test-backend=${{ needs.test-backend.result }} / codegen-drift=${{ needs.codegen-drift.result }} / lint-ssot=${{ needs.lint-ssot.result }})"
              exit 0
            fi
          done
          echo "status=pass" >> "$GITHUB_OUTPUT"
          echo "deploy gate: pass"
