name: CI

env:
  APP_VERSION: dev

on:
  pull_request:
    branches:
      - main
      - stg
      - dev
  push:
    branches:
      - main
      - stg
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      dupe: ${{ steps.filter.outputs.dupe }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Detect changed application files
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            app:
              - 'web/**'
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/test.yml'
              - '.github/workflows/deploy.yml'
              - 'web/wrangler.toml'
            dupe:
              - 'web/**'
              - 'backend/**'
              - 'infra/**'
              - '.claude/**'
              - 'docs/**'
              - '.jscpd.json'
              - 'README.md'
              - 'AGENTS.md'
              - 'flake.nix'
              - 'Makefile'

  # テスト/品質ゲートは再利用可能ワークフロー（test.yml）へ委譲する。
  tests:
    needs: detect-changes
    uses: ./.github/workflows/test.yml
    with:
      app: ${{ needs.detect-changes.outputs.app == 'true' }}
      dupe: ${{ needs.detect-changes.outputs.dupe == 'true' }}

  # dev デプロイ（dev ブランチ push 時）。
  # if 先頭の always() は、tests 内のフレーキーなジョブ（e2e 等）で
  # tests の result が success にならなくても deploy_gate 出力で判定するため。
  deploy-dev:
    needs: [detect-changes, tests]
    if: >
      always() &&
      github.ref == 'refs/heads/dev' && github.event_name == 'push' &&
      needs.detect-changes.outputs.app == 'true' &&
      needs.tests.outputs.deploy_gate == 'pass'
    uses: ./.github/workflows/deploy.yml
    with:
      # 正本: infra/environments/dev/terraform.tfvars の project_id / stack_name
      project_id: ${{ vars.GCP_PROJECT_ID_DEV || 'devforge-dev-20260311' }}
      region: ${{ vars.GCP_REGION || 'asia-northeast1' }}
      repo: ${{ vars.GCP_ARTIFACT_REPO_DEV || 'devforge-dev' }}
      service: ${{ vars.CLOUD_RUN_SERVICE_DEV || 'devforge-dev' }}
      cf_project: devforge-dev
      cf_branch: dev
    secrets:
      gcp_sa_key: ${{ secrets.GCP_SA_KEY }}
      cloud_run_url: ${{ secrets.CLOUD_RUN_URL_DEV }}
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # stg デプロイ（stg ブランチ push 時）
  deploy-stg:
    needs: [detect-changes, tests]
    if: >
      always() &&
      github.ref == 'refs/heads/stg' && github.event_name == 'push' &&
      needs.detect-changes.outputs.app == 'true' &&
      needs.tests.outputs.deploy_gate == 'pass'
    uses: ./.github/workflows/deploy.yml
    with:
      # 正本: infra/environments/stg/terraform.tfvars の project_id / stack_name
      project_id: ${{ vars.GCP_PROJECT_ID_STG || 'devforge-stg-20260404' }}
      region: ${{ vars.GCP_REGION || 'asia-northeast1' }}
      repo: ${{ vars.GCP_ARTIFACT_REPO_STG || 'devforge-stg' }}
      service: ${{ vars.CLOUD_RUN_SERVICE_STG || 'devforge-stg' }}
      cf_project: devforge-stg
      cf_branch: stg
    secrets:
      gcp_sa_key: ${{ secrets.GCP_SA_KEY_STG }}
      cloud_run_url: ${{ secrets.CLOUD_RUN_URL_STG }}
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # prod デプロイ（main ブランチ push 時）
  deploy-prod:
    needs: [detect-changes, tests]
    if: >
      always() &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.detect-changes.outputs.app == 'true' &&
      needs.tests.outputs.deploy_gate == 'pass'
    uses: ./.github/workflows/deploy.yml
    with:
      # 正本: infra/environments/prod/terraform.tfvars の project_id / stack_name
      project_id: ${{ vars.GCP_PROJECT_ID_PROD || 'devforge-prod-20260404' }}
      region: ${{ vars.GCP_REGION || 'asia-northeast1' }}
      repo: ${{ vars.GCP_ARTIFACT_REPO_PROD || 'devforge-prod' }}
      service: ${{ vars.CLOUD_RUN_SERVICE_PROD || 'devforge-prod' }}
      cf_project: devforge
      cf_branch: main
    secrets:
      gcp_sa_key: ${{ secrets.GCP_SA_KEY_PROD }}
      cloud_run_url: ${{ secrets.CLOUD_RUN_URL_PROD }}
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
